<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Turtle Race - Web Edition</title>
    <style>
        body {
            background-color: #1a1a1a;
            color: white;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        h1 {
            color: #ffaa00;
            margin-bottom: 10px;
            text-shadow: 0px 0px 10px rgba(255, 170, 0, 0.4);
        }
        canvas {
            border: 4px solid #ffaa00;
            background-color: #222222;
            box-shadow: 0px 0px 20px rgba(255, 170, 0, 0.2);
        }
        .footer {
            margin-top: 15px;
            color: #666666;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <h1>TURTLE RACE ARCADE</h1>
    <canvas id="raceCanvas" width="800" height="400"></canvas>
    <div class="footer">Developed by Ghulam Fatima</div>

    <script src="game.js"></script>
</body>
</html>
