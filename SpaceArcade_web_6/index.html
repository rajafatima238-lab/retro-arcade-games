<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space Invaders - Web Edition</title>
    <style>
        body {
            background-color: #05050a;
            color: white;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        h1 {
            color: #00ff66;
            margin-bottom: 10px;
            text-shadow: 0px 0px 15px rgba(0, 255, 102, 0.5);
            letter-spacing: 2px;
        }
        canvas {
            border: 4px solid #00ff66;
            background-color: #020205;
            box-shadow: 0px 0px 30px rgba(0, 255, 102, 0.2);
        }
        .footer {
            margin-top: 15px;
            color: #444466;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <h1>SPACE INVADERS</h1>
    <canvas id="spaceCanvas" width="800" height="600"></canvas>
    <div class="footer">Developed by Ghulam Fatima</div>

    <script src="game.js"></script>
</body>
</html>
