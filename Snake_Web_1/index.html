<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Snake - Web Edition</title>
    <style>
        body {
            background-color: #121212;
            color: white;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        h1 {
            color: #00ff00;
            margin-bottom: 10px;
            text-shadow: 0px 0px 10px rgba(0, 255, 0, 0.5);
        }
        canvas {
            border: 4px solid #00ff00;
            background-color: black;
            box-shadow: 0px 0px 20px rgba(0, 255, 0, 0.2);
        }
        .footer {
            margin-top: 15px;
            color: #555555;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <h1>SNAKE ARCADE</h1>
    <canvas id="snakeCanvas" width="600" height="600"></canvas>
    <div class="footer">Developed by Ghulam Fatima</div>

    <script src="game.js"></script>
</body>
</html>
