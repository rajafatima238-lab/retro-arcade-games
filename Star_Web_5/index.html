<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Save the Stars - Web Edition</title>
    <style>
        body {
            background-color: #0b0d1b;
            color: white;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        h1 {
            color: #ffd700;
            margin-bottom: 10px;
            text-shadow: 0px 0px 12px rgba(255, 215, 0, 0.4);
        }
        canvas {
            border: 4px solid #ffd700;
            background-color: #000000;
            box-shadow: 0px 0px 25px rgba(255, 215, 0, 0.2);
        }
        .footer {
            margin-top: 15px;
            color: #555577;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <h1>SAVE THE STARS</h1>
    <canvas id="starsCanvas" width="800" height="600"></canvas>
    <div class="footer">Developed by Ghulam Fatima</div>

    <script src="game.js"></script>
</body>
</html>
