<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Retro Snake - Web Edition</title>
    <style>
        body {
            background-color: #121212;
            color: white;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            touch-action: none; /* Prevents mobile screen shake */
        }
        h1 {
            color: #1fd4ec;
            margin-bottom: 10px;
            text-shadow: 0px 0px 10px rgba(26, 221, 221, 0.5);
        }
        canvas {
            border: 4px solid #4dd7e6;
            background-color: black;
            box-shadow: 0px 0px 20px rgba(3, 62, 72, 0.2);
            max-width: 95vw;
            max-height: 75vh;
            display: block;
        }
        .footer {
            margin-top: 15px;
            color: #555555;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <h1>Fruit Slusher</h1>
    <canvas id="FruitSlusher" width="600" height="600"></canvas>
    <div class="footer">Developed by Ghulam Fatima</div>

    <script src="game.js"></script>
</body>
</html>
